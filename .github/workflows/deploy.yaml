name: Deploy a Cloudflare Pages

# Publishes the CERN IT governance graph. Site build with the quartz-okf
# toolkit + `wrangler pages deploy`.
#
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in this repository.
# The site is public: no Basic Auth, so anyone with the URL can read it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build y deploy del grafo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz usa el historial para las fechas de las notas

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El toolkit y el Quartz que fija se descargan una vez por SHA; sin esta caché cada
      # build volvería a clonar los plugins de la comunidad.
      - name: Caché del toolkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/cern-it-governance-okf
          key: okf-${{ hashFiles('okf/quartz-okf.ref') }}
          restore-keys: okf-

      - name: Build con quartz-okf
        run: bash okf/build-site.sh

      - name: Comprobar que el build tiene contenido
        run: |
          test -f public/index.html || { echo "El build no generó public/index.html"; exit 1; }
          for f in public/static/explorer.html public/static/okf-graph.json public/static/okf-explorer-access.js; do
            test -s "$f" || { echo "falta el asset del grafo: $f"; exit 1; }
          done
          nodes=$(python3 -c "import json;print(len(json.load(open('public/static/okf-graph.json'))['nodes']))")
          echo "nodos en el grafo: $nodes"
          test "$nodes" -ge 1 || { echo "el grafo salió vacío"; exit 1; }

      # Idempotente: si el proyecto ya existe, el comando falla y se ignora.
      - name: Asegurar que el proyecto de Pages existe
        run: >-
          npx --yes wrangler@latest pages project create cern-it-governance-graph
          --production-branch main
          || echo "el proyecto ya existía"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy a Cloudflare Pages
        run: >-
          npx --yes wrangler@latest pages deploy public
          --project-name cern-it-governance-graph
          --branch main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
