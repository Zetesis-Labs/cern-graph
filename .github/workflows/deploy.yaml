name: Deploy a Cloudflare Pages

# Publishes the CERN IT governance graph. Site build with the quartz-okf
# toolkit + `wrangler pages deploy`.
#
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in this repository.
# The site is public: no Basic Auth, so anyone with the URL can read it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build y deploy del grafo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz usa el historial para las fechas de las notas

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El toolkit y el Quartz que fija se descargan una vez por SHA; sin esta caché cada
      # build volvería a clonar los plugins de la comunidad.
      - name: Caché del toolkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/cern-it-governance-okf
          key: okf-${{ hashFiles('okf/quartz-okf.ref') }}
          restore-keys: okf-

      # El toolkit construye y verifica el sitio: los suelos están en okf.config.mjs.
      - name: Build y verificación con quartz-okf
        run: bash okf/build-site.sh

      # Un corpus que se apoya en fuentes primarias vive de que esos enlaces sigan
      # existiendo. home.cern reorganiza sus URLs cada cierto tiempo y los 404 son
      # silenciosos: el sitio compila igual y la cita queda muerta.
      - name: Comprobar que las fuentes primarias siguen vivas
        continue-on-error: true
        run: |
          dead=0
          for u in $(grep -h '^url:' content/sources/*.md | sed 's/url: "//;s/"$//'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" || echo 000)
            case "$code" in
              200|403|429) ;;  # 403/429 = antibot, no enlace roto
              *) echo "::warning::fuente inalcanzable ($code): $u"; dead=$((dead+1)) ;;
            esac
          done
          echo "fuentes inalcanzables: $dead"

      # Idempotente: si el proyecto ya existe, el comando falla y se ignora.
      - name: Asegurar que el proyecto de Pages existe
        run: >-
          npx --yes wrangler@^3 pages project create cern-it-governance-graph
          --production-branch main
          || echo "el proyecto ya existía"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy a Cloudflare Pages
        run: >-
          npx --yes wrangler@^3 pages deploy public
          --project-name cern-it-governance-graph
          --branch main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
