name: Deploy a Cloudflare Pages

# Publishes the CERN IT governance graph. Site build with the quartz-okf
# toolkit + `wrangler pages deploy`.
#
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in this repository.
# The site is public: no Basic Auth, so anyone with the URL can read it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build y deploy del grafo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz usa el historial para las fechas de las notas

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El toolkit y el Quartz que fija se descargan una vez por SHA; sin esta caché cada
      # build volvería a clonar los plugins de la comunidad.
      - name: Caché del toolkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/cern-it-governance-okf
          key: okf-${{ hashFiles('okf/quartz-okf.ref') }}
          restore-keys: okf-

      - name: Build con quartz-okf
        run: bash okf/build-site.sh

      - name: Comprobar que el build tiene contenido
        run: |
          test -f public/index.html || { echo "El build no generó public/index.html"; exit 1; }
          for f in public/static/explorer.html public/static/okf-graph.json; do
            test -s "$f" || { echo "falta el asset del grafo: $f"; exit 1; }
          done
          # Desde 004 el explorador es un componente: el widget y su configuración van en cada página.
          grep -q 'class="okf-explorer' public/index.html || { echo "el componente del explorador no está en las páginas"; exit 1; }
          grep -q 'data-cfg=' public/index.html || { echo "el explorador no lleva su configuración (data-cfg)"; exit 1; }
          nodes=$(python3 -c "import json;print(len(json.load(open('public/static/okf-graph.json'))['nodes']))")
          edges=$(python3 -c "import json;print(len(json.load(open('public/static/okf-graph.json'))['edges']))")
          echo "grafo: $nodes nodos, $edges aristas"
          test "$nodes" -ge 1 || { echo "el grafo salió vacío"; exit 1; }
          # Sin aristas el sitio publica una lista de notas, no un grafo.
          test "$edges" -ge 1 || { echo "el grafo no tiene aristas: revisa las secciones '# Topology'"; exit 1; }
          # El explorador referencia sus scripts desde /static: si alguno no se emite,
          # el lienzo queda en blanco y el fallo solo se ve abriendo el navegador.
          for src in $(grep -oE '<script src="/static/[^"]+"' public/static/explorer.html | sed -E 's|.*/static/([^"]+)"|\1|'); do
            test -s "public/static/$src" || { echo "el explorador referencia /static/$src y no se ha emitido"; exit 1; }
          done

      # Un corpus que se apoya en fuentes primarias vive de que esos enlaces sigan
      # existiendo. home.cern reorganiza sus URLs cada cierto tiempo y los 404 son
      # silenciosos: el sitio compila igual y la cita queda muerta.
      - name: Comprobar que las fuentes primarias siguen vivas
        continue-on-error: true
        run: |
          dead=0
          for u in $(grep -h '^url:' content/sources/*.md | sed 's/url: "//;s/"$//'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" || echo 000)
            case "$code" in
              200|403|429) ;;  # 403/429 = antibot, no enlace roto
              *) echo "::warning::fuente inalcanzable ($code): $u"; dead=$((dead+1)) ;;
            esac
          done
          echo "fuentes inalcanzables: $dead"

      # Idempotente: si el proyecto ya existe, el comando falla y se ignora.
      - name: Asegurar que el proyecto de Pages existe
        run: >-
          npx --yes wrangler@^3 pages project create cern-it-governance-graph
          --production-branch main
          || echo "el proyecto ya existía"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy a Cloudflare Pages
        run: >-
          npx --yes wrangler@^3 pages deploy public
          --project-name cern-it-governance-graph
          --branch main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
