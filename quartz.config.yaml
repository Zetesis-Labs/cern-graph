# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: CERN
  pageTitleSuffix: " · OKF Graph"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: umami
    websiteId: 0dc104b8-0143-4bc7-9ef4-3a1a69a7fe74
    host: https://analytics.zetesis.xyz
  locale: en-US
  # Dominio canónico de Cloudflare Pages: de él dependen los enlaces absolutos,
  # el sitemap y el RSS. El subdominio *.pages.dev permanece como fallback.
  baseUrl: cern.zetesis.xyz
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#0284c7"
        tertiary: "#0d9488"
        highlight: rgba(2, 132, 199, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#0f172a"
        lightgray: "#1e293b"
        gray: "#475569"
        darkgray: "#cbd5e1"
        dark: "#f8fafc"
        secondary: "#38bdf8"
        tertiary: "#2dd4bf"
        highlight: rgba(56, 189, 248, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "github:quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "github:quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "github:quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "github:quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "github:quartz-community/description"
    enabled: true
    order: 70
  - source: "github:quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "github:quartz-community/remove-draft"
    enabled: true
  - source: "github:quartz-community/alias-redirects"
    enabled: true
  - source: "github:quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "github:quartz-community/favicon"
    enabled: true
  - source: "github:quartz-community/og-image"
    enabled: true
  - source: "github:quartz-community/cname"
    enabled: true
  - source: "github:quartz-community/canvas-page"
    enabled: true
  - source: "github:quartz-community/content-page"
    enabled: true
  - source: "github:quartz-community/folder-page"
    enabled: true
  - source: "github:quartz-community/tag-page"
    enabled: true
  - source: "github:quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "./quartz-okf"
    enabled: true
  - source: "./quartz-okf-explorer"
    enabled: true
  - source: ./quartz-okf-panels
    enabled: true
    layout:
      position: right
      priority: 60
      condition: not-index
  - source: "github:quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "github:quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "github:quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "github:quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "github:quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "github:quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "github:quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "github:quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "github:quartz-community/footer"
    enabled: true
    options:
      links:
        Zetesis: https://zetesis.xyz
        CERN: https://home.cern
        GitHub OKF: https://github.com/Zetesis-Labs/quartz-okf
  - source: "github:quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      # url and kind belong to source notes: the plugin linkifies URLs, so the
      # primary source is one click away from the top of its page.
      includedProperties:
        - description
        - url
        - kind
        - entorno
        - status
        - map_url
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
